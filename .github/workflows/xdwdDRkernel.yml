name: Build Solution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # .slnx требует свежий SDK (9.0.200+)
          dotnet-version: '9.0.x'

      - name: Build BuildTask (MSBuild task for C++ projects)
        run: dotnet build BuildTask/BuildTask.csproj -c Release

      - name: Restore NuGet packages
        run: msbuild r77.slnx /t:Restore /p:Configuration=Release /p:Platform=x64 /m

      - name: Build solution (x64)
        run: msbuild r77.slnx /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-x64
          path: |
            **/bin/Release/**
            **/x64/Release/**
            **/Win32/Release/**
            **/Release/**
          if-no-files-found: warn
